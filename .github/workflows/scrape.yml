name: Scrape proxies

on:
  schedule:
    - cron: '0 */1 * * *'   # every 3 hours (UTC). GitHub cron is best-effort —
                              # can slip a few minutes under load, fine for this.
  workflow_dispatch: {}      # lets you also trigger it manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python run_once.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.PROXY_CRAWLER_GH_TOKEN }}
